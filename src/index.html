<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smind</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <main class="workbench">
      <header class="toolbar">
        <div class="toolbar-brand" aria-label="Smind">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Smind</span>
        </div>

        <div id="currentFile" class="file-chip" hidden>
          <span class="file-chip-category"></span>
          <span class="file-chip-title"></span>
        </div>

        <div class="file-actions">
          <button id="newFile" type="button" class="tool-button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"></path></svg>
            <span>新建</span>
          </button>
          <button id="openFile" type="button" class="tool-button tool-button-primary">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5.5V12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6.5a1 1 0 0 0-1-1H8L6.6 3.8A1 1 0 0 0 5.9 3.5H3a1 1 0 0 0-1 1z"></path></svg>
            <span>打开</span>
          </button>
          <button id="saveAsFile" type="button" class="tool-button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v7M5.2 6.4 8 9.2l2.8-2.8M3 11.5V12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-.5"></path></svg>
            <span>另存为</span>
          </button>
          <button id="exportMarkdown" type="button" class="tool-button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h6L13 6v7.5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 .5-.9z"></path><path d="M9 2.5V6h3.5M5.5 9.5h5M5.5 12h3"></path></svg>
            <span>导出 MD</span>
          </button>
          <button id="pushRepository" type="button" class="tool-button tool-button-ghost">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5V3M5.2 5.8 8 3l2.8 2.8M3 11.5v1A1.5 1.5 0 0 0 4.5 14h7A1.5 1.5 0 0 0 13 12.5v-1"></path></svg>
            <span>推送</span>
          </button>
          <span id="saveStatus" class="save-status">自动保存</span>
          <input id="fileInput" type="file" accept=".json,application/json" hidden>
        </div>

        <div class="toolbar-colors">
          <div class="swatches" aria-label="颜色选择">
            <button data-color="red" title="红" type="button"></button>
            <button data-color="orange" title="橙" type="button"></button>
            <button data-color="yellow" title="黄" type="button"></button>
            <button data-color="green" title="绿" type="button"></button>
            <button data-color="cyan" title="青" type="button"></button>
            <button data-color="blue" title="蓝" type="button"></button>
            <button data-color="purple" title="紫" type="button"></button>
            <button data-color="white" title="白" type="button"></button>
            <button data-color="black" title="黑" type="button"></button>
          </div>

          <div class="font-control">
            <span class="font-control-label">字号</span>
            <input id="fontSize" aria-label="字号" type="range" min="12" max="30" value="16">
            <span id="fontValue" class="font-control-value">16</span>
          </div>
        </div>
      </header>

      <section id="canvasShell" class="canvas-shell" aria-label="思维导图画布">
        <div id="canvasSwitcher" class="canvas-switcher" role="group" aria-label="画布切换">
          <button type="button" data-canvas-id="main" aria-pressed="true">主画布</button>
          <button type="button" data-canvas-id="summary" aria-pressed="false">副画布</button>
        </div>
        <svg id="edgeSvg" class="edge-svg">
          <g id="edgeLayer"></g>
        </svg>
        <div id="nodeLayer" class="node-layer"></div>
        <div id="selectionBox" class="selection-box"></div>
      </section>
    </main>

    <aside id="inspector" class="inspector">
      <div id="inspectorResizer" class="inspector-resizer">
        <button id="inspectorToggle" class="inspector-toggle" type="button" aria-label="展开侧边栏" aria-expanded="false" title="展开侧边栏">
          <span class="inspector-toggle-icon" aria-hidden="true"></span>
        </button>
      </div>
      <div class="detail-editor">
        <div class="detail-toolbar" aria-label="节点内容工具">
          <div class="detail-tool-group" aria-label="高亮颜色">
            <span>高亮</span>
            <button data-detail-highlight="red" title="高亮红" type="button"></button>
            <button data-detail-highlight="orange" title="高亮橙" type="button"></button>
            <button data-detail-highlight="yellow" title="高亮黄" type="button"></button>
            <button data-detail-highlight="green" title="高亮绿" type="button"></button>
            <button data-detail-highlight="cyan" title="高亮青" type="button"></button>
            <button data-detail-highlight="blue" title="高亮蓝" type="button"></button>
            <button data-detail-highlight="purple" title="高亮紫" type="button"></button>
            <button data-detail-highlight="white" title="高亮白" type="button"></button>
            <button data-detail-highlight="black" title="高亮黑" type="button"></button>
          </div>
          <div class="detail-tool-group" aria-label="字体颜色">
            <span>字色</span>
            <button data-detail-color="red" title="字色红" type="button"></button>
            <button data-detail-color="orange" title="字色橙" type="button"></button>
            <button data-detail-color="yellow" title="字色黄" type="button"></button>
            <button data-detail-color="green" title="字色绿" type="button"></button>
            <button data-detail-color="cyan" title="字色青" type="button"></button>
            <button data-detail-color="blue" title="字色蓝" type="button"></button>
            <button data-detail-color="purple" title="字色紫" type="button"></button>
            <button data-detail-color="white" title="字色白" type="button"></button>
            <button data-detail-color="black" title="字色黑" type="button"></button>
          </div>
          <label class="line-gap-control">
            <span>行距</span>
            <select id="detailLineGap" aria-label="节点内容行距">
              <option value="0.1">0.1</option>
              <option value="0.2">0.2</option>
              <option value="0.3">0.3</option>
              <option value="0.4">0.4</option>
              <option value="0.5" selected>0.5</option>
              <option value="0.6">0.6</option>
              <option value="0.7">0.7</option>
              <option value="0.8">0.8</option>
              <option value="0.9">0.9</option>
            </select>
          </label>
          <label class="detail-font-control">
            <span>字号</span>
            <input id="detailFontSize" aria-label="节点内容字号" type="range" min="12" max="32" value="15">
            <span id="detailFontValue">15</span>
          </label>
          <button id="detailFormatBrush" class="format-brush-button" type="button" aria-pressed="false">格式刷</button>
          <button id="detailLineNumbers" class="detail-action-button" type="button">序号</button>
          <button id="detailNormalize" class="detail-action-button" type="button">规范</button>
          <button id="detailCode" class="detail-action-button" type="button">代码</button>
          <button id="detailPoint" class="detail-action-button" type="button">要点</button>
          <button id="detailTitle" class="detail-action-button" type="button">标题</button>
        </div>
        <div id="nodeDetail" class="detail-input" contenteditable="true" spellcheck="false"></div>
        <div id="detailImageResizeHandle" aria-hidden="true"></div>
      </div>
    </aside>
  </div>

  <dialog id="newFileDialog" class="sheet-dialog sheet-dialog-compact" aria-labelledby="newFileDialogTitle">
    <form id="newFileForm" class="sheet" method="dialog">
      <header class="sheet-head">
        <div class="sheet-title">
          <span class="sheet-eyebrow">DATA / JSON</span>
          <h2 id="newFileDialogTitle">新建思维导图</h2>
        </div>
      </header>
      <div class="sheet-body">
        <label class="field-label" for="newFileName">文件名称</label>
        <input id="newFileName" class="field-input" type="text" autocomplete="off" required placeholder="A-我的主题">
        <p class="field-hint">用 <code>分类-名称</code> 命名，例如 <code>A-网络协议</code>，文件会自动归到 <strong>A</strong> 分类。留空扩展名将自动补 <code>.json</code>。</p>
        <p id="newFileError" class="sheet-error" role="alert"></p>
      </div>
      <footer class="sheet-foot sheet-foot-actions">
        <button id="cancelNewFile" class="btn" type="button">取消</button>
        <button id="confirmNewFile" class="btn btn-primary" type="submit">确定</button>
      </footer>
    </form>
  </dialog>

  <dialog id="openFileDialog" class="sheet-dialog" aria-labelledby="openFileDialogTitle">
    <div class="sheet">
      <header class="sheet-head">
        <div class="sheet-title">
          <span class="sheet-eyebrow">DATA / 已分类</span>
          <h2 id="openFileDialogTitle">打开思维导图</h2>
          <p class="sheet-subtitle">按文件名 <code>-</code> 前面的分类自动分组，点一下即打开。</p>
        </div>
        <div class="sheet-tools">
          <label class="search-field">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.2"></circle><path d="M10.2 10.2 14 14"></path></svg>
            <input id="openFileSearch" type="text" placeholder="搜索分类或文件名" autocomplete="off" spellcheck="false" aria-label="搜索文件">
          </label>
          <button id="openFileDir" class="btn btn-quiet" type="button" title="换一个 data 目录">切换目录</button>
          <button id="closeOpenFile" class="btn btn-icon" type="button" aria-label="关闭" title="关闭 (Esc)">✕</button>
        </div>
      </header>

      <div id="openFileList" class="open-file-list" role="listbox" aria-label="data 目录中的思维导图"></div>

      <p id="openFileError" class="sheet-error" role="alert"></p>

      <footer class="sheet-foot">
        <span id="openFileSource" class="sheet-source">data/</span>
        <div class="sheet-foot-end">
          <span class="sheet-hint">↑ ↓ 选择 · Enter 打开 · Esc 关闭</span>
          <button id="cancelOpenFile" class="btn btn-quiet" type="button">关闭</button>
        </div>
      </footer>
    </div>
  </dialog>

  <script src="./logic.js"></script>
  <script src="./app.js"></script>
</body>
</html>
