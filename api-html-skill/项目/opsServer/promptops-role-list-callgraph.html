  <script type="text/plain" id="src-route">promptOps := group.Group("/promptops", permission("promptops:reshape:manage"))
promptOps.GET("/GetPromptOpsRoleListApi", controllers.GetPromptOpsRoleList)    // 查询角色列表</script>
  <script type="text/plain" id="src-controller">func GetPromptOpsRoleList(c *gin.Context) {
	page := promptOpsQueryInt(c, "page", 1)
	pageSize := promptOpsQueryInt(c, "page_size", 20)
	roleFilter := c.DefaultQuery("role", "all")
	keyword := c.Query("keyword")
	res, err := services.GetPromptOpsRoleList(c.Request.Context(), page, pageSize, roleFilter, keyword)
	if err != nil {
		respondPromptOpsErr(c, err)
		return
	}
	Success(c, res)
}</script>
  <script type="text/plain" id="src-service">func GetPromptOpsRoleList(ctx context.Context, page, pageSize int, roleFilter string, keyword string) (*models.PromptOpsRoleListVO, error) {
	page, pageSize = normalizePromptOpsPage(page, pageSize)
	roles, _, err := normalizePromptOpsRoleFilter(roleFilter)
	if err != nil {
		return nil, err
	}
	db := promptOpsDB().WithContext(ctx).Model(&models.LegacyCharacter{}).Where("role IN ?", roles)
	if kw := strings.TrimSpace(keyword); kw != "" {
		db = db.Where("nickname LIKE ?", "%"+kw+"%")
	}
	var total int64
	if err := db.Count(&total).Error; err != nil {
		return nil, err
	}
	var rows []models.LegacyCharacter
	if err := db.Order("id desc").Offset((page - 1) * pageSize).Limit(pageSize).Find(&rows).Error; err != nil {
		return nil, err
	}
	items := make([]models.PromptOpsRoleListItem, 0, len(rows))
	for i := range rows {
		snap, err := buildPromptOpsRoleSnapshot(ctx, &rows[i])
		if err != nil {
			return nil, err
		}
		items = append(items, models.PromptOpsRoleListItem{
			SourceCardID: snap.SourceCardID,
			StatusText:   snap.StatusText,
			CanReshape:   snap.CanReshape,
			Nickname:     snap.Nickname,
			DisplayImg:    firstNonBlank(snap.CoverImg, snap.Avatar, snap.AvatarThumbnail, snap.RecImg),
			Completeness: snap.Completeness.Score,
			MissingFields: snap.Completeness.MissingFields,
		})
	}
	return &models.PromptOpsRoleListVO{List: items, Total: total, Page: page, PageSize: pageSize}, nil
}</script>
  <script type="text/plain" id="src-snapshot">func buildPromptOpsRoleSnapshot(ctx context.Context, row *models.LegacyCharacter) (*models.PromptOpsRoleSnapshot, error) {
	snap := &models.PromptOpsRoleSnapshot{
		SourceCardID:      row.ID,
		SourceCharacterID: row.CharacterID,
		Nickname:          row.Nickname,
		Gender:            row.Gender,
		Tags:              splitPromptOpsTags(row.Tags),
		Avatar:            row.Avatar,
		PublicIntro:       row.PublicIntro,
		CharacterSetting:  row.CharacterSetting,
	}
	if row.Role == models.LegacyRoleUserCharacter && row.CharacterID > 0 {
		snap.Scripts = loadPromptOpsScripts(ctx, row.CharacterID)
		snap.Openings = loadPromptOpsOpenings(ctx, row.CharacterID)
	}
	if attr, err := loadPromptOpsCardAttr(ctx, row.ID); err == nil && attr != nil {
		snap.GenderCode = attr.GenderCode
		snap.Age = attr.Age
		snap.CoverImg = strings.TrimSpace(attr.CoverImg)
		snap.ExtJSON = append(json.RawMessage(nil), attr.ExtJSON...)
		snap.IntimacySkeletonJSON = append(json.RawMessage(nil), attr.IntimacySkeletonJSON...)
	}
	if rows, err := loadPromptOpsCardSections(ctx, row.ID); err == nil {
		groups, _ := buildPromptOpsSectionGroups(rows)
		snap.Sections = groups
	}
	status := promptOpsRoleStatusInfo(row.Status)
	snap.CanReshape = status.CanReshape
	snap.ReshapeBlockedReason = status.BlockedReason
	snap.StatusText = status.Text
	snap.Completeness = evaluatePromptOpsCompleteness(snap)
	snap.SourceHash, _ = hashPromptOpsSnapshot(snap)
	return snap, nil
}</script>
  <script type="text/plain" id="src-helper">func normalizePromptOpsPage(page, pageSize int) (int, int) {
	if page < 1 { page = 1 }
	if pageSize < 1 || pageSize > 100 { pageSize = 20 }
	return page, pageSize
}

func firstNonBlank(values ...string) string {
	for _, value := range values {
		if strings.TrimSpace(value) != "" {
			return strings.TrimSpace(value)
		}
	}
	return ""
}</script>

          const dy = (e.clientY - nodeDrag.sy) / scale;
          if (Math.abs(dx) > 1 || Math.abs(dy) > 1) nodeDrag.moved = true;
          n.x = nodeDrag.x + dx;
          n.y = nodeDrag.y + dy;
          group.setAttribute('transform', `translate(${n.x},${n.y})`);
          updateEdges();
        });
        group.addEventListener('pointerup', e => {
          if (!nodeDrag) return;
          const select = !nodeDrag.moved;
          group.classList.remove('dragging');
          try { group.releasePointerCapture(e.pointerId); } catch {}
          nodeDrag = null;
          if (select) renderFunction(n.id);
        });
        gNodes.appendChild(group);
      });
      updateEdges();
      let tx = 30, ty = 160, scale = .34;
      function applyTransform() { stage.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`); }
      function fit() { tx = 30; ty = 160; scale = .34; applyTransform(); }
      applyTransform();
      let pan = null;
      viewport.addEventListener('pointerdown', e => {
        if (e.target.closest && e.target.closest('.node')) return;
        pan = { x: e.clientX, y: e.clientY, tx, ty };
        viewport.classList.add('dragging');
        viewport.setPointerCapture(e.pointerId);
      });
      viewport.addEventListener('pointermove', e => {
        if (!pan) return;
        tx = pan.tx + e.clientX - pan.x;
        ty = pan.ty + e.clientY - pan.y;
        applyTransform();
      });
      viewport.addEventListener('pointerup', e => {
        pan = null;
        viewport.classList.remove('dragging');
        try { viewport.releasePointerCapture(e.pointerId); } catch {}
      });
      viewport.addEventListener('wheel', e => {
        e.preventDefault();
        const old = scale;
        scale = Math.max(.18, Math.min(1.25, scale * (e.deltaY > 0 ? .9 : 1.1)));
        const rect = viewport.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        tx = mx - (mx - tx) * (scale / old);
        ty = my - (my - ty) * (scale / old);
        applyTransform();
      }, { passive: false });
      root.querySelector('[data-action="fit"]').addEventListener('click', fit);
      root.querySelector('[data-action="zoom-in"]').addEventListener('click', () => { scale = Math.min(1.25, scale * 1.16); applyTransform(); });
      root.querySelector('[data-action="zoom-out"]').addEventListener('click', () => { scale = Math.max(.18, scale / 1.16); applyTransform(); });
      historyBack.addEventListener('click', () => { if (historyIndex > 0) renderFunction(history[--historyIndex], true); });
      historyForward.addEventListener('click', () => { if (historyIndex < history.length - 1) renderFunction(history[++historyIndex], true); });
      root.addEventListener('click', e => {
        const functionEl = e.target.closest('.function-link');
        if (functionEl && functionEl.dataset.node) {
          renderFunction(functionEl.dataset.node);
          return;
        }
        const structEl = e.target.closest('.struct-link');
        if (structEl && structEl.dataset.struct) renderStruct(structEl.dataset.struct);
      });
      root.addEventListener('input', e => {
        const commentEl = e.target.closest('.function-comment');
        if (!commentEl || !commentEl.dataset.commentId) return;
        updateNodeComment(commentEl.dataset.commentId, commentEl.value);
      });
      root.querySelectorAll('.resizer').forEach(handle => {
        handle.addEventListener('pointerdown', e => {
          const side = handle.dataset.side;
          const startX = e.clientX;
          const styles = getComputedStyle(root);
          const startLeft = parseInt(styles.getPropertyValue('--left-width')) || 360;
          const startRight = parseInt(styles.getPropertyValue('--right-width')) || 520;
          const rootWidth = root.getBoundingClientRect().width;
          const minPanel = 40;
          const minCanvas = 180;
          const maxCombined = Math.max(minPanel * 2, rootWidth - 16 - minCanvas);
          handle.setPointerCapture(e.pointerId);
          const move = ev => {
            const delta = ev.clientX - startX;
            let left = side === 'left' ? startLeft + delta : startLeft;
            let right = side === 'right' ? startRight - delta : startRight;
            left = Math.max(minPanel, left);
            right = Math.max(minPanel, right);
            const combined = left + right;
            if (combined > maxCombined) {
              const overflow = combined - maxCombined;
              if (side === 'left') right = Math.max(minPanel, right - overflow);
              else left = Math.max(minPanel, left - overflow);
            }
            root.style.setProperty('--left-width', `${left}px`);
            root.style.setProperty('--right-width', `${right}px`);
          };
          const up = ev => {
            try { handle.releasePointerCapture(ev.pointerId); } catch {}
            handle.removeEventListener('pointermove', move);
            handle.removeEventListener('pointerup', up);
          };
          handle.addEventListener('pointermove', move);
          handle.addEventListener('pointerup', up);
        });
      });
      renderFunction('controller');
    })();
  </script>
</div>
</body>
</html>
