  <script type="text/plain" id="src-auth">func procardInnerAuthorized(c *gin.Context) bool {
	cfg := zConfig.GetBCommonConfig()
	if cfg == nil {
		common.Error(c, common.CodeAuthFailed, "内部接口鉴权失败")
		return false
	}
	uuid := c.Request.Header.Get("uuid")
	timestamp := c.Request.Header.Get("timestamp")
	nonce := c.Request.Header.Get("nonce")
	token := c.Request.Header.Get("token")
	if uuid == "" || token == "" {
		common.Error(c, common.CodeAuthFailed, "内部接口鉴权失败")
		return false
	}
	data := url.Values{}
	data.Set("uuid", uuid)
	data.Set("timestamp", timestamp)
	data.Set("nonce", nonce)
	for _, caller := range procardInnerCallerCredentials(cfg) {
		if uuid != caller.ServerName {
			continue
		}
		if networkAveilchat.VerifyHMAC(caller.ServerSecret, data.Encode(), token) {
			return true
		}
		common.Error(c, common.CodeAuthFailed, "内部接口鉴权失败")
		return false
	}
	common.Error(c, common.CodeAuthFailed, "内部接口鉴权失败")
	return false
}</script>

  <script type="text/plain" id="src-lock">func acquireProCardMutationLock(ctx context.Context, cardId int64) (func(), error) {
	return acquireProCardMutationLockWithFactory(ctx, cardId, newProCardMutationLocker)
}

func acquireProCardMutationLockWithFactory(
	ctx context.Context,
	cardId int64,
	factory proCardMutationLockFactory,
) (func(), error) {
	if cardId <= 0 {
		return func() {}, nil
	}
	lockKey := redisProcard.LockCardMutationKey(cardId)
	lockCtx, cancel := context.WithCancel(ctx)
	lock := factory(lockKey, proCardMutationLockConfig{
		TTL:       proCardMutationLockTTL,
		AutoRenew: true,
	})
	deadline := time.Now().Add(proCardMutationLockWait)
	for {
		err := lock.Lock(lockCtx)
		if err == nil {
			break
		}
		if !errors.Is(err, redislock.ErrLockFailed) {
			cancel()
			return nil, err
		}
		if proCardMutationLockWait <= 0 || time.Now().Add(proCardMutationLockPoll).After(deadline) {
			cancel()
			return nil, fmt.Errorf("获取角色卡变更锁超时 cardId=%d", cardId)
		}
		time.Sleep(proCardMutationLockPoll)
	}
	return func() {
		cancel()
		if err := lock.Unlock(); err != nil {
			ljlog.LogError("acquireProCardMutationLock", "释放锁失败: "+err.Error())
		}
	}, nil
}</script>

	if operatorID <= 0 || cardID <= 0 {
		return nil, NewBizError(400, "operator_id 和 card_id 必须大于 0")
	}
	var main dbCreation.UserCustomizationCharacter
	if err := mysql.GetDB(ctx).Select("user_id").Where("id = ?", cardID).First(&main).Error; err != nil {
		return nil, err
	}
	return SubmitProCardReview(ctx, main.UserId, cardID, 0, SubmitOptions{
		TencentModerationEnabled: false,
	})
}</script>

  <script type="text/plain" id="src-submit">func SubmitProCardReview(ctx context.Context, userId int, cardId int64, editVersion int, options SubmitOptions) (*SubmitResult, error) {
	execution := newCardSubmitExecution(ctx, cardSubmitInput{
		UserID: userId,
		Request: &reqbind.SubmitProCardReviewRequest{
			CardId: cardId, EditVersion: editVersion, Role: enums.RoleTagTypeDefProCard,
		},
		Options: options,
	})
	return execution.Execute()
}</script>
  <script type="text/plain" id="src-execution">func (execution *cardSubmitExecution) Execute() (*SubmitResult, error) {
	execution.prepare()       // 校验 role 必须为进阶卡(6)，拒绝旧角色(5)
	if execution.err != nil {
		return execution.finalize()
	}
	execution.runBuild()      // 执行构建计划（如有 name_card 等构建数据）
	if execution.err != nil {
		return execution.finalize()
	}
	execution.runPublish()    // 执行发布计划：锁→校验→快照→自动过审→同步 IM
	return execution.finalize() // 锁释放 + 补偿决策 + 形成稳定结果
}</script>

          edge.path.setAttribute('d', geo.d);
          edge.fromDot.setAttribute('cx', geo.p1.x);
          edge.fromDot.setAttribute('cy', geo.p1.y);
          edge.toDot.setAttribute('cx', geo.p2.x);
          edge.toDot.setAttribute('cy', geo.p2.y);
          const length = edge.path.getTotalLength();
          const mid = edge.path.getPointAtLength(length / 2);
          const before = edge.path.getPointAtLength(Math.max(0, length / 2 - 2));
          const after = edge.path.getPointAtLength(Math.min(length, length / 2 + 2));
          const angle = Math.atan2(after.y - before.y, after.x - before.x) * 180 / Math.PI;
          edge.midArrow.setAttribute('transform', `translate(${mid.x},${mid.y}) rotate(${angle})`);
        });
      }
      nodes.forEach(n => {
        const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        group.setAttribute('class', 'node');
        group.dataset.id = n.id;
        group.setAttribute('transform', `translate(${n.x},${n.y})`);
        group.innerHTML = `
          <rect class="select-ring" x="-7" y="-7" width="${n.w + 14}" height="${n.h + 14}" rx="12"></rect>
          <rect class="node-frame" width="${n.w}" height="${n.h}" rx="8"></rect>
          <foreignObject x="0" y="0" width="${n.w}" height="${n.h}">
            <div class="node-card" xmlns="http://www.w3.org/1999/xhtml">
              <div class="kind">${esc(n.kind)}</div>
              <div class="label" title="${esc(n.label)}">${esc(n.label)}</div>
              <div class="file" title="${esc(n.file)}">${esc(n.file)}</div>
              <div class="node-sub" title="${esc(n.sub)}">${esc(n.sub)}</div>
            </div>
          </foreignObject>
        `;
        let nodeDrag = null;
        group.addEventListener('pointerdown', e => {
          e.stopPropagation();
          nodeDrag = { pointerId: e.pointerId, sx: e.clientX, sy: e.clientY, x: n.x, y: n.y, moved: false };
          group.classList.add('dragging');
          group.setPointerCapture(e.pointerId);
        });
        group.addEventListener('pointermove', e => {
          if (!nodeDrag) return;
          const dx = (e.clientX - nodeDrag.sx) / scale;
          const dy = (e.clientY - nodeDrag.sy) / scale;
          if (Math.abs(dx) > 1 || Math.abs(dy) > 1) nodeDrag.moved = true;
          n.x = nodeDrag.x + dx;
          n.y = nodeDrag.y + dy;
          group.setAttribute('transform', `translate(${n.x},${n.y})`);
          updateEdges();
        });
        group.addEventListener('pointerup', e => {
          if (!nodeDrag) return;
          const select = !nodeDrag.moved;
          group.classList.remove('dragging');
          try { group.releasePointerCapture(e.pointerId); } catch {}
          nodeDrag = null;
          if (select) renderFunction(n.id);
        });
        gNodes.appendChild(group);
      });
      updateEdges();
      let tx = 30, ty = 160, scale = .34;
      function applyTransform() { stage.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`); }
      function fit() { tx = 30; ty = 160; scale = .34; applyTransform(); }
      applyTransform();
      let pan = null;
      viewport.addEventListener('pointerdown', e => {
        if (e.target.closest && e.target.closest('.node')) return;
        pan = { x: e.clientX, y: e.clientY, tx, ty };
        viewport.classList.add('dragging');
        viewport.setPointerCapture(e.pointerId);
      });
      viewport.addEventListener('pointermove', e => {
        if (!pan) return;
        tx = pan.tx + e.clientX - pan.x;
        ty = pan.ty + e.clientY - pan.y;
        applyTransform();
      });
      viewport.addEventListener('pointerup', e => {
        pan = null;
        viewport.classList.remove('dragging');
        try { viewport.releasePointerCapture(e.pointerId); } catch {}
      });
      viewport.addEventListener('wheel', e => {
        e.preventDefault();
        const old = scale;
        scale = Math.max(.18, Math.min(1.25, scale * (e.deltaY > 0 ? .9 : 1.1)));
        const rect = viewport.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        tx = mx - (mx - tx) * (scale / old);
        ty = my - (my - ty) * (scale / old);
        applyTransform();
      }, { passive: false });
      root.querySelector('[data-action="fit"]').addEventListener('click', fit);
      root.querySelector('[data-action="zoom-in"]').addEventListener('click', () => { scale = Math.min(1.25, scale * 1.16); applyTransform(); });
      root.querySelector('[data-action="zoom-out"]').addEventListener('click', () => { scale = Math.max(.18, scale / 1.16); applyTransform(); });
      historyBack.addEventListener('click', () => { if (historyIndex > 0) renderFunction(history[--historyIndex], true); });
      historyForward.addEventListener('click', () => { if (historyIndex < history.length - 1) renderFunction(history[++historyIndex], true); });
      root.addEventListener('click', e => {
        const functionEl = e.target.closest('.function-link');
        if (functionEl && functionEl.dataset.node) {
          renderFunction(functionEl.dataset.node);
          return;
        }
        const structEl = e.target.closest('.struct-link');
        if (structEl && structEl.dataset.struct) renderStruct(structEl.dataset.struct);
      });
      root.addEventListener('input', e => {
        const commentEl = e.target.closest('.function-comment');
        if (!commentEl || !commentEl.dataset.commentId) return;
        updateNodeComment(commentEl.dataset.commentId, commentEl.value);
      });
      root.querySelectorAll('.resizer').forEach(handle => {
        handle.addEventListener('pointerdown', e => {
          const side = handle.dataset.side;
          const startX = e.clientX;
          const styles = getComputedStyle(root);
          const startLeft = parseInt(styles.getPropertyValue('--left-width')) || 360;
          const startRight = parseInt(styles.getPropertyValue('--right-width')) || 520;
          const rootWidth = root.getBoundingClientRect().width;
          const minPanel = 40;
          const minCanvas = 180;
          const maxCombined = Math.max(minPanel * 2, rootWidth - 16 - minCanvas);
          handle.setPointerCapture(e.pointerId);
          const move = ev => {
            const delta = ev.clientX - startX;
            let left = side === 'left' ? startLeft + delta : startLeft;
            let right = side === 'right' ? startRight - delta : startRight;
            left = Math.max(minPanel, left);
            right = Math.max(minPanel, right);
            const combined = left + right;
            if (combined > maxCombined) {
              const overflow = combined - maxCombined;
              if (side === 'left') right = Math.max(minPanel, right - overflow);
              else left = Math.max(minPanel, left - overflow);
            }
            root.style.setProperty('--left-width', `${left}px`);
            root.style.setProperty('--right-width', `${right}px`);
          };
          const up = ev => {
            try { handle.releasePointerCapture(ev.pointerId); } catch {}
            handle.removeEventListener('pointermove', move);
            handle.removeEventListener('pointerup', up);
          };
          handle.addEventListener('pointermove', move);
          handle.addEventListener('pointerup', up);
        });
      });
      renderFunction('controller');
    })();
  </script>
</div>
</body>
</html>
